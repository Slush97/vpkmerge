[workspace]
resolver = "2"
members = [
    "vpkmerge-core",
    "vpkmerge-cli",
    "gui/src-tauri",
    "morphic",
    "vpkmerge-harness",
]
exclude = ["vendor/valve_pak"]

# valve_pak 0.1.0 (crates.io, MIT) vendored with one fix: VPK::open no longer
# requires the optional v2 MD5 section. See vendor/valve_pak/src/vpk.rs.
[patch.crates-io]
valve_pak = { path = "vendor/valve_pak" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
