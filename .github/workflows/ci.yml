name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (Linux, fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy (pedantic, deny warnings)
        # --lib --bins --tests, not --all-targets: the `examples/` are dev-only
        # scratch (ad-hoc analysis tools), exempt from the pedantic gate.
        run: cargo clippy --workspace --lib --bins --tests -- -D warnings

      - name: test
        run: cargo test --workspace --lib --bins --tests

  cross-os:
    name: Cross-OS sanity (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: check core + cli
        # --lib --bins --tests, not --all-targets: skip dev-only `examples/`.
        run: cargo check -p vpkmerge-core -p vpkmerge-cli --lib --bins --tests

      - name: test core + cli
        # --lib --bins --tests, not the default (which builds examples too): skip
        # dev-only `examples/`.
        run: cargo test -p vpkmerge-core -p vpkmerge-cli --lib --bins --tests

  # Builds the Linux CLI exactly like release.yml does, so a change that drags
  # in a newer glibc symbol (or breaks the zig toolchain) fails here instead of
  # in a published release that Grimoire users then can't launch.
  linux-release-binary:
    name: Linux release binary (glibc 2.35)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-gnu

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.24.1

      - name: build
        run: cargo zigbuild --release --locked -p vpkmerge-cli --target x86_64-unknown-linux-gnu.2.35

      - name: check glibc floor
        run: tools/check-glibc-floor.sh target/x86_64-unknown-linux-gnu/release/vpkmerge 2.35

      - name: run on Ubuntu 22.04
        # The loader rejects a too-new glibc symbol before main runs, so
        # --version alone catches the break; trippy-preview is a real command
        # that needs no game files.
        run: |
          docker run --rm -v "$PWD/target/x86_64-unknown-linux-gnu/release/vpkmerge:/usr/local/bin/vpkmerge:ro" ubuntu:22.04 \
            sh -c 'vpkmerge --version && vpkmerge trippy-preview --style kaleido --frames 2 --size 64 --out /tmp/p.png'

  frontend:
    name: Frontend (Vite build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: gui/pnpm-lock.yaml

      - name: install
        working-directory: gui
        run: pnpm install --frozen-lockfile

      - name: build
        working-directory: gui
        run: pnpm vite:build
