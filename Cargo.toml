[workspace]
resolver = "2"
members = [
    "vpkmerge-core",
    "vpkmerge-cli",
    "gui/src-tauri",
    "morphic",
]
exclude = ["vendor/valve_pak"]

# valve_pak 0.1.0 (crates.io, MIT) vendored with two fixes: VPK::open no longer
# requires the optional v2 MD5 section, and it reads directory strings with
# BufRead::read_until instead of one read_exact per byte (pak01's 144K-entry
# directory parsed in ~50 ms). See vendor/valve_pak/src/vpk.rs.
[patch.crates-io]
valve_pak = { path = "vendor/valve_pak" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
