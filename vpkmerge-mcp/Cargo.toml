[package]
name = "vpkmerge-mcp"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local MCP server exposing the vpkmerge Deadlock modding engine as intent-shaped tools."
repository = "https://github.com/Slush97/vpkmerge"
# Embeds ../docs and ../vpkmerge-harness/skills, which sit outside the crate.
publish = false

[[bin]]
name = "vpkmerge-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
rmcp = { version = "3.5", features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
vpkmerge-core = { path = "../vpkmerge-core" }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"

[lints]
workspace = true
