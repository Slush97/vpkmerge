[package]
name = "vpkmerge-harness"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local workflow and tool contracts for the VPKMerge modding harness"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
vpkmerge-core = { path = "../vpkmerge-core" }

[dev-dependencies]

[lints]
workspace = true
